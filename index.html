<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synergy - MVP</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <style>
        .medicine-item {
            padding: 10px;
            margin: 5px 0;
            background-color: #f8f9fa;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .remove-btn {
            border: none;
            background: none;
            cursor: pointer;
            padding: 5px;
        }

        .alert-high {
            background-color: #f8d7da;
            border-color: #f5c2c7;
            color: #842029;
        }

        .alert-medium {
            background-color: #fff3cd;
            border-color: #ffecb5;
            color: #664d03;
        }

        .alert-low {
            background-color: #d1e7dd;
            border-color: #badbcc;
            color: #0f5132;
        }

        .medicine-category {
            font-size: 0.8em;
            color: #6c757d;
        }

        #interaction-warnings {
            margin-top: 20px;
        }

        .alert {
            margin: 10px 0;
            padding: 15px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h1 class="h4 mb-0">Synergy - Sprawdź Interakcje Lekowe</h1>
                    </div>
                    
                    <div class="card-body">
                        <h2 id="step-header" class="h4 mb-3">Krok 1: Lista obecnie przyjmowanych leków</h2>
                        <p id="step-description" class="text-muted mb-4">
                            Wybierz wszystkie leki, które pacjent obecnie przyjmuje:
                        </p>

                        <!-- Medicine Selection Form -->
                        <div class="mb-4">
                            <div class="input-group">
                                <select id="medicine-select" class="form-select">
                                    <option value="">Wybierz lek...</option>
                                </select>
                                <button id="add-button" onclick="handleMedicineAction()" class="btn btn-primary">
                                    Dodaj do listy
                                </button>
                            </div>
                        </div>

                        <!-- Current Medicines List -->
                        <div class="mb-4">
                            <h5>Lista leków pacjenta:</h5>
                            <div id="medicine-list" class="border rounded p-3">
                                <!-- Medicines will be added here dynamically -->
                            </div>
                        </div>

                        <!-- Proceed Button -->
                        <button id="proceed-button" onclick="proceedToNewMedication()" class="btn btn-success mb-4">
                            Przejdź do sprawdzania nowego leku ➡️
                        </button>

                        <!-- Interaction Warnings -->
                        <div id="interaction-warnings">
                            <!-- Warnings will be added here dynamically -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Our JavaScript -->
    <script src="medicines.js"></script>
    <script src="app.js"></script>
</body>
</html>
